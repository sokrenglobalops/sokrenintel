# SOKREN relay — Cloudflare Worker + Durable Object
# Deploy:  npx wrangler deploy        (after: npx wrangler login, npx wrangler secret put AISSTREAM_KEY)
name = "sokren-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

# One shared AISStream connection lives in this Durable Object and fans out to every visitor.
[durable_objects]
bindings = [{ name = "AIS_HUB", class_name = "AisHub" }, { name = "AIR_HUB", class_name = "AirHub" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AisHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AirHub"]

[vars]
# Browsers on these origins may use the relay. Add "http://localhost:8080" while developing locally.
ALLOWED_ORIGINS = "https://www.sokren.com,https://sokren.com,https://sokrenglobalops.github.io"
# Upstream AIS source. Leave as is.
AIS_UPSTREAM = "wss://stream.aisstream.io/v0/stream"
# OpenSky blocks Cloudflare; aircraft snapshots come through this Deno Deploy helper (air-helper/main.ts).
# It needs secret AIR_HELPER_KEY here = HELPER_KEY in the Deno project.
AIR_HELPER_URL = "https://serene-lemming-5927.sokrenglobalops.deno.net"

# Secrets (never in this file):  AISSTREAM_KEY, OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET  → npx wrangler secret put NAME
